# conda env for the driver-vs-marker benchmark
#   conda env create -f environment.yml
#   conda activate driver-benchmark
#   python -m ipykernel install --user --name driver-benchmark --display-name "Python (driver-benchmark)"
# Tested 29 Oct 2026 with Python 3.13, numpy 2.5, pandas 3.0, scipy 1.18, matplotlib 3.11,
# scikit-learn 1.9, scanpy 1.12, anndata 0.13, shap 0.54.
name: driver-benchmark
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - numpy
  - pandas
  - scipy
  - matplotlib
  - scikit-learn
  - scanpy          # pseudotime / neighbours (methods, simulation post-processing)
  - anndata
  - pyyaml          # BoolODE config files
  - jupyterlab
  - nbconvert
  - ipykernel
  - pip
  - pip:
      - shap>=0.45  # only for the SHAP/BUNGEE baseline
